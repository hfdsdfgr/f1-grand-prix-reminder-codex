name: grand_prix_reminder
description: A lightweight Formula 1 schedule and reminder app.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.3
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  http: ^1.2.2
  flutter_svg: ^2.2.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  flutter_scene: 0.23.0
  vector_math: ^2.2.0
  hooks: ^2.0.2
  share_plus: ^13.3.0
  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Regular.ttf
  uses-material-design: true
  assets:
    - assets/fonts/Newsreader-OFL.txt
    - assets/fonts/Barlow-OFL.txt
    - assets/fonts/BarlowCondensed-OFL.txt
    - assets/circuits/
    - assets/evolution/car.json
    - flutter_scene_generated/
