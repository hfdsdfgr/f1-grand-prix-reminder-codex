// Loft cross-sections: [z, centerX, centerY, halfWidth, halfHeight].
function loft(id,sections,material='body',segments=8){
 const rings=sections.map(([z,x,y,w,h])=>Array.from({length:segments},(_,i)=>{const a=2*Math.PI*i/segments;return [x+w*Math.cos(a),y+h*Math.sin(a),z]}));

}
for(const s of [-1,1]){

 loft('sidepods',[[-.52,s*.49,.44,.27,.19],[-.22,s*.55,.49,.28,.2],[.35,s*.56,.43,.25,.17],[.95,s*.39,.32,.17,.1],[1.22,s*.3,.27,.08,.06]]);
 loft('cockpit',[[-.9,s*.23,.54,.09,.1],[-.55,s*.32,.63,.075,.1],[.1,s*.3,.63,.075,.1],[.32,s*.2,.58,.11,.1]]);

 rod('halo',[0,.95,-.64],[s*.33,.94,-.3],.038);rod('halo',[s*.33,.94,-.3],[s*.3,.84,.14],.038);rod('halo',[s*.3,.84,.14],[s*.25,.65,.23],.035);
}

function project(x,y,z){
 y-=.45;
 const rx=x*Math.cos(state.yaw)+z*Math.sin(state.yaw),rz=z*Math.cos(state.yaw)-x*Math.sin(state.yaw);
 const ry=y*Math.cos(state.pitch)-rz*Math.sin(state.pitch),depth=y*Math.sin(state.pitch)+rz*Math.cos(state.pitch);

 return {x:width/2+rx*scale,y:height/2-ry*scale,depth};
}
function draw(){
 ctx.clearRect(0,0,width,height);faces=[];
 for(const c of components){
  for(const f of c.faces){
   const pts=f.points.map(p=>project(...p)),path=new Path2D();pts.forEach((p,j)=>j?path.lineTo(p.x,p.y):path.moveTo(p.x,p.y));path.closePath();
   const a=f.points[0],b=f.points[1],d=f.points[2],u=b.map((v,i)=>v-a[i]),v=d.map((v,i)=>v-a[i]),n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],len=Math.hypot(...n)||1;

 }
 faces.sort((a,b)=>a.depth-b.depth);

}
let labelBoxes=[];
function drawLabels(){

 const candidates=[...new Set(priorities)].map(id=>({...mesh(id),screen:project(...mesh(id).anchor)})).filter(c=>c.screen.x>8&&c.screen.x<width-8&&c.screen.y>40&&c.screen.y<height-25).slice(0,limit);

updateGeneration();
new ResizeObserver(()=>{
 const r=canvas.getBoundingClientRect();width=r.width;height=r.height;const dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();
}).observe(canvas);
const pointers=new Map();let start=null,moved=false,pinched=false;
const distance=()=>{const p=[...pointers.values()];return p.length===2?Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y):0};
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);canvas.focus({preventScroll:true});if(!pointers.size){start={x:e.clientX,y:e.clientY};moved=false;pinched=false;}pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>1)pinched=true;});
canvas.addEventListener('pointermove',e=>{
 const old=pointers.get(e.pointerId);if(!old)return;
 const prevDistance=distance();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>4)moved=true;
 if(pointers.size===2){const next=distance();if(prevDistance>0)state.zoom=clamp(state.zoom*next/prevDistance,.5,3);}
 else if(pointers.size===1){state.yaw=wrap(state.yaw+(e.clientX-old.x)*.01*state.speed);state.pitch=clamp(state.pitch+(e.clientY-old.y)*.01*state.speed,-80*Math.PI/180,89*Math.PI/180);}
 draw();
});
canvas.addEventListener('pointerup',e=>{
 if(!moved&&!pinched&&pointers.size===1){const r=canvas.getBoundingClientRect();ctx.save();ctx.setTransform(1,0,0,1,0,0);const hit=[...faces].reverse().find(f=>ctx.isPointInPath(f.path,e.clientX-r.left,e.clientY-r.top));ctx.restore();if(hit)state.part=hit.name;}
 pointers.delete(e.pointerId);draw();
});
for(const name of ['pointercancel','lostpointercapture'])canvas.addEventListener(name,e=>pointers.delete(e.pointerId));
canvas.addEventListener('wheel',e=>{e.preventDefault();state.zoom=clamp(state.zoom*Math.exp(-e.deltaY*.001),.5,3);draw();},{passive:false});
canvas.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-'].includes(e.key))return;e.preventDefault();if(e.key==='ArrowLeft')state.yaw=wrap(state.yaw-.1);if(e.key==='ArrowRight')state.yaw=wrap(state.yaw+.1);if(e.key==='ArrowUp')state.pitch=clamp(state.pitch+.1,-1.39,1.55);if(e.key==='ArrowDown')state.pitch=clamp(state.pitch-.1,-1.39,1.55);if(['+','='].includes(e.key))state.zoom=clamp(state.zoom+.1,.5,3);if(e.key==='-')state.zoom=clamp(state.zoom-.1,.5,3);draw();});
for(const k of ['yaw','pitch','zoom','speed'])$(k).addEventListener('input',()=>{state[k]=Number($(k).value)*(k==='yaw'||k==='pitch'?Math.PI/180:1);draw();});
for(const k of ['wire','labels'])$(k).addEventListener('change',()=>{state[k]=$(k).checked;draw();});
$('part').addEventListener('change',()=>{state.part=$('part').value;draw();});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{const views={default:[-.65,.55],front:[Math.PI,.12],rear:[0,.12],side:[Math.PI/2,.12],top:[0,Math.PI/2-.01]};[state.yaw,state.pitch]=views[b.dataset.view];state.zoom=1;draw();}));
$('export').addEventListener('click',()=>{$('settings').value=JSON.stringify({...state,yawDegrees:state.yaw*180/Math.PI,pitchDegrees:state.pitch*180/Math.PI},null,2);});
</script>
</html>
